split_csv: results/dataset_split.csv
data_root: data/raw/ESP-Fi_dataset
normalizer_path: models/csi_normalizer.npz
results_dir: results/formal_seed42
checkpoints_dir: models/formal_seed42
checkpoint_selection: val_accuracy_then_lower_val_loss
