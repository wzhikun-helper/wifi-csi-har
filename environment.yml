# Direct dependencies observed locally on 2026-10-23; no installation performed.
# This is not a solved cross-machine lockfile. No local prefix/build paths.
name: wifi-csi
channels:
  - conda-forge
dependencies:
  - python=3.11.16
  - pip=26.2.1
  - pip:
      # torch INSTALLER=pip; the original installation index was not recorded.
      # Verified current official source contains the cp311 win_amd64 cu126 wheel.
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.14.0+cu126
      - numpy==2.4.6
      - scipy==1.17.1
      - scikit-learn==1.9.0
      - PyYAML==6.0.3
      - matplotlib==3.11.1
      # Existing local notebook tools; experiment entry points do not require them.
      - notebook==7.6.2
      - jupyterlab==4.6.3
      # Report utilities measured in the separate report runtime, not wifi-csi.
      - pypdf==6.10.0
      - pdfplumber==0.11.9
# XeLaTeX/ctex, Windows fonts and Poppler are SYSTEM tools, not Conda packages here.
# If CUDA wheel resolution fails, stop and obtain the exact compatible official
# wheel separately; do not silently substitute a CPU/different torch build.
